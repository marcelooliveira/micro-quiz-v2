AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  micro-quiz-v2

  Sample SAM Template for micro-quiz-v2
  
# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3

Resources:

  QuizAnswersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: quiz-answers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: studentId
          AttributeType: S
        - AttributeName: questionId
          AttributeType: S
      KeySchema:
        - AttributeName: studentId
          KeyType: HASH
        - AttributeName: questionId
          KeyType: RANGE

  AnswerSubmissionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - app.ts
        External:
          - "@aws-sdk/*"
    Properties:
      CodeUri: answer-submission/
      Handler: dist/answer-submission/app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref QuizAnswersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QuizAnswersTable
      Events:
        AnswerSubmission:
          Type: Api
          Properties:
            Path: /answer-submission
            Method: post

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  HelloWorldApi:
    Description: "API Gateway endpoint URL for Prod stage for Hello World function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/hello/"
  HelloWorldFunction:
    Description: "Hello World Lambda Function ARN"
    Value: !GetAtt HelloWorldFunction.Arn
  HelloWorldFunctionIamRole:
    Description: "Implicit IAM Role created for Hello World function"
    Value: !GetAtt HelloWorldFunctionRole.Arn
  AnswerSubmissionApi:
    Description: "API Gateway endpoint URL for Prod stage for Answer Submission function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/answer-submission/"
  AnswerSubmissionFunction:
    Description: "Answer Submission Lambda Function ARN"
    Value: !GetAtt AnswerSubmissionFunction.Arn
  AnswerSubmissionFunctionIamRole:
    Description: "Implicit IAM Role created for Answer Submission function"
    Value: !GetAtt AnswerSubmissionFunctionRole.Arn
  QuizAnswersTableName:
    Description: "DynamoDB table name"
    Value: !Ref QuizAnswersTable
